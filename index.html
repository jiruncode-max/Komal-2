<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Profile Detector - Custom Gift</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Input Box + Tombol X */
        .search-container {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 750px;
        }

        .search-container input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 8px;
            border: 1px solid #1d4ed8;
            background-color: #0b0f19;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        .search-container input:focus {
            border-color: #1e40af;
        }

        .search-container button.btn-search {
            padding: 14px 24px;
            border-radius: 8px;
            border: none;
            background-color: #1d4ed8;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-container button.btn-search:hover {
            background-color: #1e40af;
        }

        .btn-clear-main {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-clear-main:hover {
            background-color: #ef4444;
            border-color: #dc2626;
        }

        /* Layar Utama Dua Kotak Utama */
        .board-container {
            display: flex;
            gap: 16px;
            width: 100%;
            max-width: 750px;
            height: 480px;
        }

        /* Kotak Awal */
        .card {
            flex: 1;
            border: 2px solid #4b5563;
            border-radius: 12px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        /* Berubah pas FOTO ADA */
        .card.has-photo {
            border-color: #1d4ed8;
            background: linear-gradient(135deg, #1f2937 0%, #111827 50%, #1f2937 100%);
        }

        .request-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #ffffff;
            user-select: none;
        }

        .request-placeholder .plus-icon {
            font-size: 48px;
            font-weight: 300;
            line-height: 1;
        }

        .request-placeholder .request-text {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Profile Wrap */
        .profile-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Kotak Segi Panjang Bintang (Kiri Atas) */
        .top-star-box {
            position: absolute;
            top: 8px;
            left: 14px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px 2px 4px;
            background-color: #111827;
            border: 2px solid #000000;
            border-radius: 999px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            z-index: 5;
        }

        /* Icon Bulat Bintang Biru (SANGAT KECIL - 16px) */
        .star-circle {
            width: 16px; 
            height: 16px;
            background-color: #20D5EC;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .star-circle svg {
            width: 10px;
            height: 10px;
            fill: #ffffff;
        }

        .star-count-text {
            font-size: 11px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1;
        }

        /* Foto Profil Bulat Tengah */
        .profile-avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #d1d5db;
            background-color: #374151;
            box-shadow: 0 0 20px rgba(209, 213, 219, 0.3);
            cursor: pointer;
            transition: transform 0.1s ease;
            display: block;
            margin: 0 auto;
        }

        .profile-avatar:active {
            transform: scale(0.95);
        }

        /* Kotak Nama Setengah Bulat (Bawah Kiri) */
        .profile-name-box {
            position: absolute;
            left: 14px;
            bottom: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px 6px 14px;
            background-color: #111827;
            border: 2px solid #000000;
            border-radius: 999px;
            max-width: 85%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .profile-name {
            font-size: 13px;
            font-weight: 500;
            color: #f3f4f6;
            word-break: break-word;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .plus-badge {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #374151;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid #000000;
        }

        .plus-badge svg {
            width: 10px;
            height: 10px;
            fill: #ffffff;
        }

        .tiktok-verified-badge {
            display: inline-flex;
            align-items: center;
        }

        .error-message {
            color: #ef4444;
            font-size: 12px;
            position: absolute;
            left: 14px;
            bottom: 8px;
        }

        /* Opsi Tombol Kirim Gift */
        .gift-options-group {
            display: none;
            align-items: center;
            gap: 6px;
        }

        .btn-send-gift {
            height: 48px;
            padding: 0 16px;
            border-radius: 8px;
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
            transition: filter 0.2s, transform 0.1s;
        }

        .btn-send-gift:hover {
            filter: brightness(1.1);
        }

        .btn-send-gift:active {
            transform: scale(0.95);
        }

        .btn-send-gift img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        /* Animasi Terbang Gift */
        .flying-gift {
            position: absolute;
            width: 70px;
            height: 70px;
            object-fit: contain;
            pointer-events: none;
            z-index: 100;
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 5px 15px rgba(236, 72, 153, 0.5));
        }

        @media (max-width: 600px) {
            .board-container {
                height: 400px;
            }
            .profile-avatar {
                width: 150px;
                height: 150px;
            }
            .search-container {
                flex-wrap: wrap;
            }
            .gift-options-group {
                width: 100%;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>

    <!-- Barisan Pencarian + Tombol X + Tombol Gift -->
    <div class="search-container">
        <input type="text" id="usernameInput" placeholder="">
        <button class="btn-search" onclick="detectTikTok()">✔</button>
        <button class="btn-clear-main" id="btnClear" title="Hapus Target" onclick="clearTarget()">✘</button>
        
        <!-- Grup Tombol Gift -->
        <div class="gift-options-group" id="giftOptionsGroup">
            
            <!-- Tombol Gift x30 -->
            <button class="btn-send-gift" onclick="throwGift()">
                <img src="" alt="Gift" id="mainBtnImg">
                x30
            </button>

            <!-- Tombol Gift x200 -->
            <button class="btn-send-gift" onclick="throwGift200()">
                <img src="" alt="Galaxy" id="btnGift200Img">
                x200
            </button>

            <!-- Tombol Gift Baru 44999 -->
            <button class="btn-send-gift" onclick="throwUniverse()">
                <img src="" alt="Universe" id="btnUniverseImg">
                44999
            </button>
        </div>
    </div>

    <!-- 2 Kotak Utama -->
    <div class="board-container">
        <!-- Kotak Kiri Kosong -->
        <div class="card" id="cardLeft"></div>

        <!-- Kotak Kanan Tempat Foto Bulat & Nama Target -->
        <div class="card" id="cardRight">
            
            <!-- Placeholder saat belum ada foto -->
            <div class="request-placeholder" id="placeholderText">
                <span class="plus-icon">+</span>
                <span class="request-text">Permintaan</span>
            </div>

            <!-- Profile Content Area -->
            <div class="profile-wrapper" id="profileWrapper" style="display: none;">
                
                <!-- Kotak Segi Panjang Bintang (Kiri Atas) -->
                <div class="top-star-box">
                    <div class="star-circle">
                        <!-- SVG Bentuk Bintang Putih -->
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                    </div>
                    <span class="star-count-text" id="starCountDisplay">0</span>
                </div>

                <img id="avatarImg" class="profile-avatar" alt="Profile photo" style="display: none;" onclick="throwGift()">
                
                <!-- Nama TikTok di BAGIAN BAWAH -->
                <div class="profile-name-box" id="nameContainer" style="display: none;">
                    <div class="profile-name" id="displayName"></div>
                    <div class="plus-badge">
                        <svg viewBox="0 0 12 12">
                            <path d="M5 0h2v5h5v2H7v5H5V7H0V5h5V0z"/>
                        </svg>
                    </div>
                </div>

                <div class="error-message" id="errorMsg"></div>
            </div>
        </div>
    </div>

    <script>
        // === KONFIGURASI GAMBAR GIFT ===
        const tiktokLogoUrl = "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/4e7ad6bdf0a1d860c538f38026d4e812~tplv-obj.webp";
        const gift200Url = "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/21549ba24f76a01d00373cb8e35660ae.png~tplv-obj.webp";
        const universeUrl = "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/8f471afbcebfda3841a6cc515e381f58~tplv-obj.webp";

        document.addEventListener("DOMContentLoaded", () => {
            const imgEl = document.getElementById("mainBtnImg");
            if (imgEl) imgEl.src = tiktokLogoUrl;

            const imgEl200 = document.getElementById("btnGift200Img");
            if (imgEl200) imgEl200.src = gift200Url;

            const imgElUniverse = document.getElementById("btnUniverseImg");
            if (imgElUniverse) imgElUniverse.src = universeUrl;
        });

        let currentScore = 0;

        // === FUNGSI FORMAT ANGKA (1.00K, 1.00M) ===
        function formatScore(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(2) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(2) + 'K';
            }
            return num.toString();
        }

        // === FUNGSI ANIMASI UMUM ===
        function launchSingleGiftEffect(imageUrl, durationMs) {
            const cardRight = document.getElementById('cardRight');
            const avatarImg = document.getElementById('avatarImg');
            if (!avatarImg || avatarImg.style.display === 'none') return;

            const gift = document.createElement('img');
            gift.src = imageUrl; 
            gift.className = 'flying-gift';

            // Set durasi animasi sesuai parameter
            gift.style.transition = `all ${durationMs}ms cubic-bezier(0.175, 0.885, 0.32, 1.275)`;

            const cardRect = cardRight.getBoundingClientRect();
            
            // Posisi: Atas Kanan Foto
            const avatarRect = avatarImg.getBoundingClientRect();
            
            const startX = (avatarRect.left - cardRect.left) + avatarRect.width - 70; 
            const startY = (avatarRect.top - cardRect.top) - 120; 

            const targetX = startX + 20; 
            const targetY = startY + 20; 

            gift.style.left = startX + 'px';
            gift.style.top = startY + 'px';
            // HILANGKAN ROTASI, hanya scale (membesar)
            gift.style.transform = 'scale(0.5)'; 
            gift.style.opacity = '0';
            cardRight.appendChild(gift);

            requestAnimationFrame(() => {
                setTimeout(() => {
                    gift.style.left = targetX + 'px';
                    gift.style.top = targetY + 'px';
                    // HILANGKAN ROTASI, hanya scale (membesar)
                    gift.style.transform = 'scale(1.2)'; 
                    gift.style.opacity = '1';
                }, 20);
            });

            setTimeout(() => {
                // Efek bergetar pada foto saat kena gift
                avatarImg.style.transform = 'scale(1.05)';
                setTimeout(() => {
                    avatarImg.style.transform = 'scale(1)';
                }, 150);
                gift.remove();
            }, durationMs);
        }

        // === LOGIKA TOMBOL GIFT ===

        // 1. Tombol x30 - Durasi 1 Detik
        function throwGift() {
            const avatarImg = document.getElementById('avatarImg');
            if (!avatarImg || avatarImg.style.display === 'none') return;

            currentScore += 30;
            // Gunakan formatScore
            document.getElementById('starCountDisplay').innerText = formatScore(currentScore);

            launchSingleGiftEffect(tiktokLogoUrl, 1000);
        }

        // 2. Tombol x200 - Durasi 1 Detik
        function throwGift200() {
            const avatarImg = document.getElementById('avatarImg');
            if (!avatarImg || avatarImg.style.display === 'none') return;

            currentScore += 200;
            // Gunakan formatScore
            document.getElementById('starCountDisplay').innerText = formatScore(currentScore);

            launchSingleGiftEffect(gift200Url, 1000);
        }

        // 3. Tombol Baru 44999 - Durasi 1 Detik
        function throwUniverse() {
            const avatarImg = document.getElementById('avatarImg');
            if (!avatarImg || avatarImg.style.display === 'none') return;

            currentScore += 44999;
            // Gunakan formatScore
            document.getElementById('starCountDisplay').innerText = formatScore(currentScore);

            // Animasi 1 detik
            launchSingleGiftEffect(universeUrl, 1000);
        }

        // === LOGIKA DETEKSI FOTO ===
        
        function pick(obj, keys, fb) {
            for (const k of keys) {
                let v = obj;
                for (const p of k.split(".")) v = v?.[p];
                if (v !== undefined && v !== null && v !== "") return v;
            }
            return fb;
        }

        function badgeSVG(s) {
            return '<span class="tiktok-verified-badge"><svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#20D5EC"/><path d="M7.5 12.2l3 3 6-6" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
        }

        function extractUser(raw) {
            if (!raw || typeof raw !== "object") throw new Error("API response empty");
            if (raw.code !== undefined && Number(raw.code) !== 0) throw new Error(raw.msg || "Akun tidak ditemukan");
            const root = raw.data || raw;
            const info = root.userInfo || root.user_info || {};
            const user = info.user || root.user || info || root;
            const username = String(pick(user, ["uniqueId", "unique_id", "username"], "")).replace(/^@/, "").trim();
            if (!username) throw new Error("Username tidak ditemukan");
            return {
                username,
                name: String(pick(user, ["nickname", "name", "display_name"], username)),
                avatar: String(pick(user, ["avatarLarger", "avatarMedium", "avatarThumb", "avatar", "avatar_url"], "")),
                verified: Boolean(pick(user, ["verified", "isVerified", "is_verified"], false))
            };
        }

        async function requestTikwmUser(username) {
            const res = await fetch("https://www.tikwm.com/api/user/info/", {
                method: "POST",
                cache: "no-store",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
                    "Accept": "application/json"
                },
                body: "unique_id=" + encodeURIComponent(username)
            });
            if (!res.ok) throw new Error("HTTP " + res.status);
            const txt = await res.text();
            let json;
            try { 
                json = JSON.parse(txt); 
            } catch { 
                throw new Error("Respons API bukan JSON"); 
            }
            return extractUser(json);
        }

        function normalize(v) {
            let s = String(v || "").trim();
            s = s.replace(/^https?:\/\/(?:www\.|m\.)?tiktok\.com\//i, "");
            s = s.replace(/^@/, "");
            return s.split(/[/?#]/)[0].trim();
        }

        function clearTarget() {
            const cardRight = document.getElementById('cardRight');
            const placeholderText = document.getElementById('placeholderText');
            const profileWrapper = document.getElementById('profileWrapper');
            const avatarImg = document.getElementById('avatarImg');
            const displayName = document.getElementById('displayName');
            const nameContainer = document.getElementById('nameContainer');
            const errorMsg = document.getElementById('errorMsg');
            const inputField = document.getElementById('usernameInput');
            const giftOptionsGroup = document.getElementById('giftOptionsGroup');

            cardRight.classList.remove('has-photo');
            placeholderText.style.display = 'flex';
            profileWrapper.style.display = 'none';
            nameContainer.style.display = 'none';
            displayName.innerText = '';
            errorMsg.innerText = '';
            avatarImg.style.display = 'none';
            giftOptionsGroup.style.display = 'none';

            currentScore = 0;
            document.getElementById('starCountDisplay').innerText = '0';

            inputField.value = '';
            inputField.focus();
        }

        async function detectTikTok() {
            const rawInput = document.getElementById('usernameInput').value;
            const username = normalize(rawInput);

            const cardRight = document.getElementById('cardRight');
            const placeholderText = document.getElementById('placeholderText');
            const profileWrapper = document.getElementById('profileWrapper');
            const avatarImg = document.getElementById('avatarImg');
            const displayName = document.getElementById('displayName');
            const nameContainer = document.getElementById('nameContainer');
            const errorMsg = document.getElementById('errorMsg');
            const giftOptionsGroup = document.getElementById('giftOptionsGroup');

            if (!username) {
                alert("Silakan masukkan username TikTok!");
                return;
            }

            cardRight.classList.remove('has-photo');
            placeholderText.style.display = 'flex';
            profileWrapper.style.display = 'none';
            nameContainer.style.display = 'none';
            displayName.innerText = '';
            errorMsg.innerText = '';
            avatarImg.style.display = 'none';
            giftOptionsGroup.style.display = 'none';

            currentScore = 0;
            document.getElementById('starCountDisplay').innerText = '0';

            try {
                const data = await requestTikwmUser(username);

                const verifiedIcon = data.verified ? badgeSVG(14) : "";
                displayName.innerHTML = data.name + verifiedIcon;
                
                if (data.avatar) {
                    avatarImg.src = data.avatar;
                    avatarImg.style.display = 'block';
                }

                placeholderText.style.display = 'none';
                cardRight.classList.add('has-photo');
                nameContainer.style.display = 'inline-flex';
                profileWrapper.style.display = 'flex';
                giftOptionsGroup.style.display = 'flex';
                
            } catch (err) {
                console.error(err);
                placeholderText.style.display = 'none';
                errorMsg.innerText = err.message || 'Gagal mengambil data dari server TikWM.';
                profileWrapper.style.display = 'flex';
            }
        }
    </script>

</body>
</html>
